<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Billing Application</title>

    <link rel="stylesheet" href="css/style.css">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<div class="container mt-5 mb-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1 class="text-primary mb-0">
            Smart Billing Application
        </h1>

        <button
                class="btn btn-danger"
                onclick="logout()">
            Logout
        </button>

    </div>

    <hr>
    <!-- Dashboard Section -->
<div class="mb-5">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="text-secondary mb-0">Dashboard</h2>

        <button
            class="btn btn-outline-primary"
            onclick="loadDashboard()">
            Refresh Dashboard
        </button>
    </div>

    <div class="row g-3">

        <div class="col-md-4 col-lg">
            <div class="card shadow-sm text-center p-3 dashboard-card">
                <h5>Total Products</h5>
                <h2 id="dashboardProducts">0</h2>
            </div>
        </div>

        <div class="col-md-4 col-lg">
            <div class="card shadow-sm text-center p-3 dashboard-card">
                <h5>Total Customers</h5>
                <h2 id="dashboardCustomers">0</h2>
            </div>
        </div>

        <div class="col-md-4 col-lg">
            <div class="card shadow-sm text-center p-3 dashboard-card">
                <h5>Total Invoices</h5>
                <h2 id="dashboardInvoices">0</h2>
            </div>
        </div>

        <div class="col-md-6 col-lg">
            <div class="card shadow-sm text-center p-3 dashboard-card">
                <h5>Total Sales</h5>
                <h2 id="dashboardSales">₹0.00</h2>
            </div>
        </div>

        <div class="col-md-6 col-lg">
            <div class="card shadow-sm text-center p-3 dashboard-card">
                <h5>Low Stock</h5>
                <h2 id="dashboardLowStock">0</h2>
            </div>
        </div>

    </div>

</div>

    <div class="row g-4">

        <!-- Product Card -->
        <div class="col-md-4">
            <div class="card shadow p-3">

                <h3>Products</h3>

                <button
                    class="btn btn-primary mt-2"
                    onclick="loadProducts()">
                    View Products
                </button>

                <button
                    class="btn btn-success mt-2"
                    onclick="showProductForm()">
                    Add Product
                </button>

            </div>
        </div>

        <!-- Customer Card -->
        <div class="col-md-4">
            <div class="card shadow p-3">

                <h3>Customers</h3>

                <button
                    class="btn btn-success mt-2"
                    onclick="loadCustomers()">
                    View Customers
                </button>

                <button
                    class="btn btn-primary mt-2"
                    onclick="showCustomerForm()">
                    Add Customer
                </button>

            </div>
        </div>

        <!-- Invoice Card -->
        <div class="col-md-4">
            <div class="card shadow p-3">

                <h3>Invoices</h3>

                <button
                    class="btn btn-warning mt-2"
                    onclick="loadInvoices()">
                    View Invoices
                </button>

                <button
                    class="btn btn-dark mt-2"
                    onclick="showInvoiceForm()">
                    Create Invoice
                </button>

            </div>
        </div>

    </div>

    <div id="messageBox" class="mt-4"></div>

    <div id="dataSection" class="mt-4"></div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="js/script.js"></script>

</body>
</html>
